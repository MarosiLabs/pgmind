name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  PGRX_VERSION: "0.19.2"

jobs:
  extension:
    name: extension (pg${{ matrix.pg }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        pg: [16, 17, 18]
    steps:
      - uses: actions/checkout@v5

      - name: Install PostgreSQL ${{ matrix.pg }} (PGDG)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update -qq
          # server package too: -server-dev alone has pg_config/headers but no initdb/postgres,
          # which `cargo pgrx test` needs to boot its test cluster
          sudo apt-get install -y -qq postgresql-${{ matrix.pg }} postgresql-server-dev-${{ matrix.pg }}
          # cargo pgrx test installs the extension into the system dirs — make them runner-writable
          # Own the install dirs rather than making them world-writable: `cargo
          # pgrx install` needs to write here, but a+rwx lets any other process
          # on the runner drop a .so that Postgres then loads as the postgres user.
          sudo chown "$USER" /usr/lib/postgresql/${{ matrix.pg }}/lib /usr/share/postgresql/${{ matrix.pg }}/extension

      # rustup on the runner respects rust-toolchain.toml automatically.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: extension

      - name: Install cargo-pgrx
        run: cargo install cargo-pgrx --version "$PGRX_VERSION" --locked

      - name: pgrx init
        run: cargo pgrx init --pg${{ matrix.pg }} /usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config

      - name: Test (runs inside a real Postgres)
        working-directory: extension
        run: cargo pgrx test pg${{ matrix.pg }}

      - name: Lint
        if: matrix.pg == 18
        run: make lint PG=${{ matrix.pg }}

  eval:
    name: eval harness
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Phase 2 suites run against real storage: the harness installs the
      # extension and boots a scratch cluster (PG18 leg).
      - name: Install PostgreSQL 18 (PGDG)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-18 postgresql-server-dev-18
          sudo chown "$USER" /usr/lib/postgresql/18/lib /usr/share/postgresql/18/extension

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            extension
            core

      - name: Install cargo-pgrx
        run: cargo install cargo-pgrx --version "$PGRX_VERSION" --locked

      - name: pgrx init
        run: cargo pgrx init --pg18 /usr/lib/postgresql/18/bin/pg_config

      - run: make eval
        env:
          PGMIND_PG_CONFIG: /usr/lib/postgresql/18/bin/pg_config

      - uses: actions/upload-artifact@v5
        if: always()   # the failure report is the one you need most
        with:
          name: eval-report
          # results/, not published/: publishing is opt-in (PGMIND_PUBLISH),
          # so a CI run measures the deliverables without rewriting the record.
          path: eval/results/
