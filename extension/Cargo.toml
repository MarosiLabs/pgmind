[package]
name = "pgmind"
version = "0.0.1"
edition = "2021"
license = "PostgreSQL"
description = "pgmind: a brain for AI agents inside PostgreSQL — an Obsidian-shaped knowledge vault with block identity, history, and deterministic context assembly. No AI in the middle."
repository = "https://github.com/marosi/pgmind"

[lib]
crate-type = ["cdylib"]

[features]
default = ["pg18"]
pg16 = ["pgrx/pg16", "pgrx-tests/pg16"]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17"]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18"]
pg_test = []

[dependencies]
pgrx = "=0.19.2"
pgmind-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
[dev-dependencies.pgrx-tests]
version = "=0.19.2"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
